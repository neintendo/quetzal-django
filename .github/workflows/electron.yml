# This workflow will do a clean installation of node dependencies, cache/restore them, 
# build the source code and run tests across different versions of node. Then package the backend
# into a python executable file to be finally bundled with the Electron package.

name: Electron CI

on:
  push:
    branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [23.x, 24.x, 25.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        python-version: [3.13.5]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'quetzal_react/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      working-directory: ./quetzal_react

    - name: Install Python Dependencies & Create Installer
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pyinstaller quetzal_django.spec

    - name: Build
      run: npm run build --if-present
      working-directory: ./quetzal_react

    - name: Package
      run: npm run package
      working-directory: ./quetzal_react
